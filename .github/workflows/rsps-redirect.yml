name: Build RSPSRedirect

on:
  push:
    branches: [ rsps-redirect ]
    paths: [ 'rsps-redirect/**', '.github/workflows/rsps-redirect.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # macOS arm64 runners queued 15 min and were cancelled, 2026-10-29
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache roothide Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: roothide-theos-${{ runner.os }}-v3

      - name: Theos build dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q build-essential fakeroot rsync curl perl zip git libxml2

      - name: Install roothide Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
        env:
          THEOS: ${{ github.workspace }}/theos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build rootless .deb
        working-directory: rsps-redirect
        run: make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: RSPSRedirect-rootless-deb
          path: rsps-redirect/packages/*.deb
          if-no-files-found: error
